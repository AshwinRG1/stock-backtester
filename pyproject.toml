[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-backtester"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "pandas-ta>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.0",
]

[project.scripts]
backtester = "app.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=0.20",  # required by starlette.testclient.TestClient
]

[tool.setuptools.packages.find]
# Only package the actual library — `data/` is runtime state and
# `alembic/` is migration scripts, neither belongs in a wheel.
include = ["app*"]

[tool.setuptools.package-data]
# Include the webapp HTML so a future wheel install ships the frontend too.
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
